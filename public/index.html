<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Libri</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <div class="main-content">
            <!-- Sidebar Filtri -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-close">
                    <button id="close-sidebar" class="close-btn" title="Chiudi filtri">✕</button>
                </div>
                <div class="filter-section">
                    <h2>Filtri</h2>
                    
                    <div class="filter-group">
                        <label for="search-input">Cerca per titolo:</label>
                        <div class="search-input-wrapper">
                            <input type="text" id="search-input" placeholder="Titolo libro..." class="search-box">
                            <button id="clear-search-btn" class="clear-search-btn" title="Cancella ricerca">✕</button>
                        </div>
                    </div>
                    
                    <div class="filter-group">
                        <label for="number-search-input">Cerca per numero:</label>
                        <div class="search-input-wrapper">
                            <input type="number" id="number-search-input" placeholder="Es. 42" class="search-box" min="1">
                            <button id="clear-number-btn" class="clear-search-btn" title="Cancella numero">✕</button>
                        </div>
                    </div>
                    
                    <div class="filter-group">
                        <label for="collana-filter">Collana:</label>
                        <select id="collana-filter">
                            <option value="">Tutte le collane</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>
                            <input type="checkbox" id="owned-filter"> Nella collezione
                        </label>
                    </div>

                    <div class="filter-group">
                        <label>
                            <input type="checkbox" id="not-owned-filter"> Non nella collezione
                        </label>
                    </div>

                    <div class="filter-group">
                        <label>
                            <input type="checkbox" id="read-filter"> Letti
                        </label>
                    </div>

                    <div class="filter-group">
                        <label>
                            <input type="checkbox" id="not-read-filter"> Non letti
                        </label>
                    </div>

                    <div class="filter-group">
                        <label>
                            <input type="checkbox" id="digital-filter"> Digitali
                        </label>
                    </div>

                    <button id="reset-filters" class="btn-secondary">Resetta Filtri</button>
                </div>

                <div class="stats-section">
                    <h3>Statistiche</h3>
                    <p>Totale libri: <span id="total-books">0</span></p>
                    <p>Nella collezione: <span id="total-owned">0</span></p>
                    <p>Letti: <span id="total-read">0</span></p>
                    <button id="new-book-btn" class="btn-primary" style="width: 100%; margin-top: 15px;">Nuovo libro</button>
                    <button id="import-web-btn" class="btn-primary" style="width: 100%; margin-top: 15px;">Importa da web</button>
                    <button id="import-calibre-btn" class="btn-primary" style="width: 100%; margin-top: 15px;">Importa da Calibre-Web</button>
                    <button id="reload-btn" class="btn-secondary" style="width: 100%; margin-top: 15px;">⟳ Reload DB</button>
                    <button id="hard-reload-btn" class="btn-secondary red" style="width: 100%; margin-top: 15px;">⟳ Hard Reload</button>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="content-area">
                <!-- Book List -->
                <section id="books-list-section" class="books-section">
                    <div class="books-header">
                        <div class="header-title-group">
                            <button id="menu-toggle" class="menu-toggle" title="Apri filtri">☰</button>
                            <h2>Gestione Libri</h2>
                        </div>
                        <div class="header-controls">
                            <div class="pagination-items-select">
                                <label for="items-per-page">Libri per pagina:</label>
                                <input type="number" id="items-per-page" class="items-input" min="2" max="32" step="1" value="12">
                            </div>
                            <div class="view-toggle">
                                <button id="view-list" class="view-btn active" title="Vista Lista">≡</button>
                                <button id="view-grid" class="view-btn" title="Vista Griglia">⊞</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Top Pagination -->
                    <div id="pagination-top" class="pagination">
                        <button id="first-page-top" class="pagination-btn" title="Prima pagina">⏮</button>
                        <button id="prev-page-top" class="pagination-btn" title="Pagina precedente">◀</button>
                        
                        <div class="pagination-info">
                            <input type="number" id="page-input-top" class="page-input" min="1" value="1">
                            <span> / </span>
                            <span id="total-pages-top">1</span>
                        </div>
                        
                        <button id="next-page-top" class="pagination-btn" title="Pagina successiva">▶</button>
                        <button id="last-page-top" class="pagination-btn" title="Ultima pagina">⏭</button>
                    </div>
                    
                    <div id="books-list" class="books-list"></div>
                    
                    <!-- Bottom Pagination -->
                    <div id="pagination" class="pagination">
                        <button id="first-page" class="pagination-btn" title="Prima pagina">⏮</button>
                        <button id="prev-page" class="pagination-btn" title="Pagina precedente">◀</button>
                        
                        <div class="pagination-info">
                            <input type="number" id="page-input" class="page-input" min="1" value="1">
                            <span> / </span>
                            <span id="total-pages">1</span>
                        </div>
                        
                        <button id="next-page" class="pagination-btn" title="Pagina successiva">▶</button>
                        <button id="last-page" class="pagination-btn" title="Ultima pagina">⏭</button>
                    </div>
                </section>

                <!-- Book Detail -->
                <section id="book-detail-section" class="book-detail" style="display: none;">
                    <div class="detail-top-nav">
                        <div class="detail-left-buttons">
                            <button id="back-btn" class="btn-back">← Indietro</button>
                            <button id="edit-book-btn" class="btn-edit" onclick="openEditModal()">Modifica</button>
                            <button id="delete-book-btn" class="btn-delete">Elimina</button>
                        </div>
                        <div class="detail-nav-buttons">
                            <button id="prev-book-btn" class="detail-nav-btn prev-btn" title="Libro precedente">◀</button>
                            <button id="next-book-btn" class="detail-nav-btn next-btn" title="Libro successivo">▶</button>
                        </div>
                    </div>
                    <div id="book-detail-content" class="book-detail-content"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Modifica Libro</h2>
                <button id="close-edit-modal" class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="edit-form">
                    <div class="form-group">
                        <label for="edit-title-ita">Titolo Italiano:</label>
                        <input type="text" id="edit-title-ita" name="title_ita">
                    </div>

                    <div class="form-group">
                        <label for="edit-title-orig">Titolo Originale:</label>
                        <input type="text" id="edit-title-orig" name="title_orig">
                    </div>

                    <div class="form-group">
                        <label for="edit-author">Autore:</label>
                        <input type="text" id="edit-author" name="author">
                    </div>

                    <div class="form-group">
                        <label for="edit-date-pub">Data Pubblicazione:</label>
                        <input type="date" id="edit-date-pub" name="date_pub">
                    </div>

                    <div class="form-group">
                        <label for="edit-cover-author">Autore Copertina:</label>
                        <input type="text" id="edit-cover-author" name="cover_author">
                    </div>

                    <div class="form-group">
                        <label for="edit-editore">Editore:</label>
                        <input type="text" id="edit-editore" name="editore">
                    </div>

                    <div class="form-group">
                        <label for="edit-collana">Collana:</label>
                        <input type="text" id="edit-collana" name="collana">
                    </div>

                    <div class="form-group">
                        <label for="edit-synopsis">Sinossi:</label>
                        <textarea id="edit-synopsis" name="synopsis" rows="4"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="edit-comment">Commento:</label>
                        <textarea id="edit-comment" name="comment" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Valutazione (stelle):</label>
                        <div id="edit-stars-widget" class="stars-widget"></div>
                        <input type="hidden" id="edit-stars" name="stars" value="0">
                    </div>

                    <div class="form-group form-checkbox">
                        <label for="edit-owned">
                            <input type="checkbox" id="edit-owned" name="owned">
                            Nella collezione
                        </label>
                    </div>

                    <div class="form-group form-checkbox">
                        <label for="edit-read">
                            <input type="checkbox" id="edit-read" name="read">
                            Letto
                        </label>
                    </div>

                    <div class="form-group form-checkbox">
                        <label for="edit-digital">
                            <input type="checkbox" id="edit-digital" name="digital">
                            Digitale
                        </label>
                    </div>

                    <div class="form-group form-checkbox">
                        <label for="edit-reprint">
                            <input type="checkbox" id="edit-reprint" name="reprint">
                            Ristampa
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="save-btn" class="btn-primary">Salva</button>
                <button id="cancel-btn" class="btn-secondary">Annulla</button>
            </div>
        </div>
    </div>

    <!-- Create Modal -->
    <div id="create-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nuovo Libro</h2>
                <button id="close-create-modal" class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="create-form">
                    <div class="form-group">
                        <label for="create-number">Numero:</label>
                        <input type="number" id="create-number" name="number" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="create-title-ita">Titolo Italiano:</label>
                        <input type="text" id="create-title-ita" name="title_ita" required>
                    </div>

                    <div class="form-group">
                        <label for="create-title-orig">Titolo Originale:</label>
                        <input type="text" id="create-title-orig" name="title_orig">
                    </div>

                    <div class="form-group">
                        <label for="create-author">Autore:</label>
                        <input type="text" id="create-author" name="author" required>
                    </div>

                    <div class="form-group">
                        <label for="create-date-pub">Data Pubblicazione:</label>
                        <input type="date" id="create-date-pub" name="date_pub">
                    </div>

                    <div class="form-group">
                        <label for="create-cover-author">Autore Copertina:</label>
                        <input type="text" id="create-cover-author" name="cover_author">
                    </div>

                    <div class="form-group">
                        <label for="create-collana-select">Collana:</label>
                        <select id="create-collana-select" name="collana"></select>
                    </div>

                    <div class="form-group form-checkbox">
                        <label for="create-use-new-collana">
                            <input type="checkbox" id="create-use-new-collana" name="use_new_collana">
                            Aggiungi una nuova collana
                        </label>
                    </div>

                    <div id="new-collana-fields" class="new-collana-fields" style="display: none;">
                        <div class="form-group">
                            <label for="create-new-collana-name">Nome nuova collana:</label>
                            <input type="text" id="create-new-collana-name" name="new_collana_name">
                        </div>

                        <div class="form-group">
                            <label for="create-new-editore-name">Editore:</label>
                            <input type="text" id="create-new-editore-name" name="new_editore_name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="create-cover-image">Copertina:</label>
                        <input type="file" id="create-cover-image" name="cover_image" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label for="create-synopsis">Sinossi:</label>
                        <textarea id="create-synopsis" name="synopsis" rows="4"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="create-comment">Commento:</label>
                        <textarea id="create-comment" name="comment" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="create-stars">Valutazione (0-50):</label>
                        <input type="number" id="create-stars" name="stars" min="0" max="50" step="5" value="0">
                    </div>

                    <div class="form-group form-checkbox">
                        <label for="create-owned">
                            <input type="checkbox" id="create-owned" name="owned">
                            Nella collezione
                        </label>
                    </div>

                    <div class="form-group form-checkbox">
                        <label for="create-read">
                            <input type="checkbox" id="create-read" name="read">
                            Letto
                        </label>
                    </div>

                    <div class="form-group form-checkbox">
                        <label for="create-digital">
                            <input type="checkbox" id="create-digital" name="digital">
                            Digitale
                        </label>
                    </div>

                    <div class="form-group form-checkbox">
                        <label for="create-reprint">
                            <input type="checkbox" id="create-reprint" name="reprint">
                            Ristampa
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="create-save-btn" class="btn-primary">Crea</button>
                <button id="create-cancel-btn" class="btn-secondary">Annulla</button>
            </div>
        </div>
    </div>

    <!-- Calibre Import Modal -->
    <div id="calibre-modal" class="modal" style="display: none;">
        <div class="modal-content calibre-modal-content">
            <div class="modal-header">
                <h2>Importa da Calibre-Web</h2>
                <button id="close-calibre-modal" class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Search & Input Section -->
                <div class="calibre-search-section">
                    <div class="calibre-search-box">
                        <input type="text" id="calibre-search-input" placeholder="Cerca titolo, autore o incolla URL / ID Calibre-Web (es. 1353)...">
                        <button id="calibre-search-btn" class="btn-primary" type="button">Cerca</button>
                    </div>
                    <div id="calibre-status-msg" class="calibre-status-msg" style="display: none;"></div>
                </div>

                <!-- Results List Container -->
                <div id="calibre-results-container" class="calibre-results-container">
                    <div class="calibre-section-title" id="calibre-results-title">Libri recenti in Calibre:</div>
                    <div id="calibre-results-list" class="calibre-results-list">
                        <div class="calibre-loading">Caricamento libreria Calibre...</div>
                    </div>
                </div>

                <!-- Selected Book Form Container -->
                <div id="calibre-form-container" class="calibre-form-container" style="display: none;">
                    <div class="calibre-form-toolbar">
                        <button id="calibre-back-btn" class="btn-secondary btn-sm" type="button">← Torna all'elenco</button>
                        <span id="calibre-badge" class="calibre-badge">Calibre-Web</span>
                    </div>

                    <div class="calibre-preview-card">
                        <div class="calibre-preview-cover">
                            <img id="calibre-preview-cover-img" src="" alt="Copertina">
                        </div>
                        <div class="calibre-preview-details">
                            <h3 id="calibre-preview-title">Titolo</h3>
                            <p id="calibre-preview-author" class="calibre-author-text">Autore</p>
                            <p id="calibre-preview-meta" class="calibre-meta-text"></p>
                        </div>
                    </div>

                    <form id="calibre-import-form">
                        <input type="hidden" id="calibre-book-id" name="calibreId">

                        <div class="form-row">
                            <div class="form-group flex-1">
                                <label for="calibre-number">Numero:</label>
                                <input type="number" id="calibre-number" name="number" min="1" required>
                            </div>

                            <div class="form-group flex-2">
                                <label for="calibre-collana-select">Collana:</label>
                                <select id="calibre-collana-select" name="collana" required></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="calibre-title-ita">Titolo Italiano:</label>
                            <input type="text" id="calibre-title-ita" name="title_ita" required>
                        </div>

                        <div class="form-group">
                            <label for="calibre-title-orig">Titolo Originale:</label>
                            <input type="text" id="calibre-title-orig" name="title_orig">
                        </div>

                        <div class="form-group">
                            <label for="calibre-author">Autore:</label>
                            <input type="text" id="calibre-author" name="author" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group flex-1">
                                <label for="calibre-date-pub">Data Pubblicazione:</label>
                                <input type="date" id="calibre-date-pub" name="date_pub">
                            </div>

                            <div class="form-group flex-1">
                                <label for="calibre-cover-author">Autore Copertina:</label>
                                <input type="text" id="calibre-cover-author" name="cover_author">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="calibre-synopsis">Sinossi:</label>
                            <textarea id="calibre-synopsis" name="synopsis" rows="5"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="calibre-comment">Commento:</label>
                            <textarea id="calibre-comment" name="comment" rows="2"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="calibre-stars">Valutazione (0-50):</label>
                            <input type="number" id="calibre-stars" name="stars" min="0" max="50" step="5" value="0">
                        </div>

                        <div class="calibre-checkboxes-grid">
                            <div class="form-group form-checkbox">
                                <label for="calibre-owned">
                                    <input type="checkbox" id="calibre-owned" name="owned" checked>
                                    Nella collezione
                                </label>
                            </div>

                            <div class="form-group form-checkbox">
                                <label for="calibre-digital">
                                    <input type="checkbox" id="calibre-digital" name="digital" checked>
                                    Digitale
                                </label>
                            </div>

                            <div class="form-group form-checkbox">
                                <label for="calibre-read">
                                    <input type="checkbox" id="calibre-read" name="read">
                                    Letto
                                </label>
                            </div>

                            <div class="form-group form-checkbox">
                                <label for="calibre-reprint">
                                    <input type="checkbox" id="calibre-reprint" name="reprint">
                                    Ristampa
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="modal-footer">
                <button id="calibre-import-submit-btn" class="btn-primary" type="button" style="display: none;">Importa Libro</button>
                <button id="calibre-cancel-btn" class="btn-secondary" type="button">Chiudi</button>
            </div>
        </div>
    </div>

    <!-- Loader Overlay -->
    <div id="save-loader-overlay" class="loader-overlay" style="display: none;">
        <div class="loader-popup">
            <div class="loader-spinner"></div>
            <span class="loader-text">Salvataggio in corso...</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
